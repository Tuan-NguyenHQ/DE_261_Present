# ============================================================
#  dbt Profile — ClickHouse Connection
# ============================================================

travelhub:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: analytics
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: 8123
      user: "{{ env_var('CLICKHOUSE_USER', 'travelhub') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'clickhouse_secret_2026') }}"
      secure: false
      verify: false
      custom_settings:
        join_use_nulls: 1     # LEFT JOIN không khớp → NULL (mặc định ClickHouse trả 0/'' làm test not_null/relationships vô nghĩa)

    prod:
      type: clickhouse
      schema: analytics
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: 8123
      user: "{{ env_var('CLICKHOUSE_USER', 'travelhub') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'clickhouse_secret_2026') }}"
      secure: false
      verify: false
      custom_settings:
        join_use_nulls: 1     # LEFT JOIN không khớp → NULL (mặc định ClickHouse trả 0/'' làm test not_null/relationships vô nghĩa)
